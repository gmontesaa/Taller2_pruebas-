name: CI  # Nombre del workflow

on: # Define cuándo se ejecuta el pipeline
  push:
    branches: ["main"] # El workflow se ejecuta cada vez que alguien hace push a main
  pull_request:
    branches: ["main"] # El workflow se ejecuta cuando se abre o actualiza un Pull Request hacia main

jobs:
  test: # Identificador del job
    runs-on: ubuntu-latest # Indica en qué sistema operativo se ejecuta el job

    steps: # Lista de acciones secuenciales que se ejecutan dentro del job
      - uses: actions/checkout@v4 # Descarga el código del repositorio en la máquina de CI

      - uses: actions/setup-python@v5 # Instala Python en la máquina de CI
        with:
          python-version: "3.11" # Versión de Python

      - name: Install dependencies
        run: | # Ejecuta comandos de consola
          pip install -r requirements.txt

      - name: Run integration test with fake
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          pytest test_unit_real_api.py test_integration_real_api.py -v
